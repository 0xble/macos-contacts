name: Repository nightly

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert checked-out run SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Assert exact clean head after setup
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet --ignore-submodules=none
          git diff --cached --quiet --ignore-submodules=none
      - name: Run exact-SHA nightly
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: ./bin/ci nightly "$EXPECTED_SHA"
      - name: Assert exact clean head after checks
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet --ignore-submodules=none
          git diff --cached --quiet --ignore-submodules=none

  qualification:
    name: qualification
    needs: [nightly]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require nightly success
        env:
          NIGHTLY_RESULT: ${{ needs.nightly.result }}
        run: test "$NIGHTLY_RESULT" = success
