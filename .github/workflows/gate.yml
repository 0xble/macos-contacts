name: Repository gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert checked-out PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Assert exact clean head after setup
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet --ignore-submodules=none
          git diff --cached --quiet --ignore-submodules=none
      - name: Run exact-SHA gate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./bin/ci gate "$EXPECTED_SHA"
      - name: Assert exact clean head after checks
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet --ignore-submodules=none
          git diff --cached --quiet --ignore-submodules=none

  qualification:
    name: qualification
    needs: [gate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require gate success
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: test "$GATE_RESULT" = success
